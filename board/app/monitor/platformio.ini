[platformio]
name = okdcc monitor
default_envs = debug
workspace_dir = ../../.build/okdcc/app/monitor

[env]
platform = platformio/espressif32@6.11.0 ; 6.12 は M5Unified がまだ対応していない
framework = espidf
board = m5stack-core-esp32
upload_protocol = esptool
upload_speed = 1500000
monitor_speed = 115200
lib_deps =
  lovyan03/LovyanGFX@^1.2
  https://github.com/kakkun61/clay-lgfx-renderer.git#180c8bb7e92238c7a13962344f58033c777e38aa
  ../../.
lib_ldf_mode = deep

[env:release]
build_type = release
build_flags =
  -Wall
  ; clay.h
  -isystem ../../lib/clay

[env:debug]
build_type = debug
build_flags =
  -Wall
  -D DCC_ASSERT
  ; clay.h
  -isystem ../../lib/clay
  ; esp32's esp_log.h
  -D CORE_DEBUG_LEVEL=5
